name: Prepare Firebase dependency lock
on:
  push:
    branches: [firebase-free-plan-foundation]
    paths: ['.github/workflows/firebase-deps.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Update package manifest and lockfile without running install scripts
        run: npm install firebase@latest --save --package-lock-only --ignore-scripts
      - name: Commit lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || (git commit -m "Add Firebase JavaScript SDK and lockfile" && git push origin HEAD:firebase-free-plan-foundation)
